<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fight Card — Upcoming UFC Events</title>

<!-- Add-to-homescreen behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fight Card">
<meta name="theme-color" content="#0B0B0C">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<style>
  @font-face {
    font-family: 'system';
    src: local('-apple-system');
  }

  :root{
    --bg: #0B0B0C;
    --bg-raised: #151517;
    --line: #232326;
    --red: #E8352B;
    --red-dim: #7a1c17;
    --white: #F5F3EE;
    --grey: #8C8B90;
    --grey-dim: #57565B;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  body{
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header{
    padding: 28px 20px 18px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top:0;
    background: rgba(11,11,12,0.92);
    backdrop-filter: blur(10px);
    z-index: 10;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }

  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .brand .eyebrow{
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--red);
    font-weight:700;
  }

  .brand h1{
    margin:0;
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.02em;
  }

  #refresh{
    background:none;
    border:1px solid var(--line);
    color:var(--grey);
    font-size:12px;
    padding:8px 12px;
    border-radius:100px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  #refresh:active{ background:var(--bg-raised); }
  #refresh svg{ width:13px; height:13px; }

  main{ padding: 4px 16px 60px; max-width:640px; margin:0 auto; }

  .status{
    padding: 40px 20px;
    text-align:center;
    color:var(--grey);
    font-size:14px;
  }
  .status.error{ color: var(--red); }

  .card{
    background: var(--bg-raised);
    border:1px solid var(--line);
    border-radius:16px;
    margin: 14px 0;
    overflow:hidden;
  }

  .card .top{
    padding: 18px 18px 14px;
    border-bottom:1px solid var(--line);
  }

  .countdown{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:8px;
  }

  .event-name{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.01em;
    line-height:1.25;
    margin:0 0 10px;
  }

  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap: 14px;
    font-size:13px;
    color:var(--grey);
  }

  .meta-row .item{
    display:flex;
    align-items:center;
    gap:6px;
  }

  .meta-row svg{ width:14px; height:14px; flex-shrink:0; opacity:0.7; }

  .main-event{
    padding: 16px 18px 18px;
  }

  .main-event .label{
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--grey-dim);
    margin-bottom:10px;
    font-weight:700;
  }

  .bout{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    font-size:15px;
    font-weight:700;
  }

  .bout .fighter{ flex:1; text-align:center; line-height:1.3; }
  .bout .fighter.left{ text-align:right; }
  .bout .fighter.right{ text-align:left; }
  .bout .vs{
    color:var(--red);
    font-size:11px;
    font-weight:800;
    letter-spacing:0.05em;
  }

  footer{
    text-align:center;
    padding: 20px;
    color:var(--grey-dim);
    font-size:11px;
  }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation: rise 0.4s ease backwards; }
    .card:nth-child(2){ animation-delay: 0.05s; }
    .card:nth-child(3){ animation-delay: 0.1s; }
    .card:nth-child(4){ animation-delay: 0.15s; }
    @keyframes rise{
      from{ opacity:0; transform: translateY(8px); }
      to{ opacity:1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="eyebrow">Live schedule</span>
    <h1>Fight Card</h1>
  </div>
  <button id="refresh" onclick="loadEvents()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    Refresh
  </button>
</header>

<main id="app">
  <div class="status" id="status">Loading upcoming events…</div>
</main>

<footer>Data from ESPN · Pull to refresh or reopen anytime for the latest</footer>

<script>
const ENDPOINT = "https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard";

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZoneName:'short' });
}
function daysUntil(iso){
  const now = new Date();
  const then = new Date(iso);
  const diff = Math.ceil((then - now) / (1000*60*60*24));
  if (diff < 0) return "In progress / recent";
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  return `In ${diff} days`;
}

const pinIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`;
const clockIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`;

function render(events){
  const app = document.getElementById('app');
  if (!events.length){
    app.innerHTML = `<div class="status">No upcoming events found right now. Check back soon.</div>`;
    return;
  }

  app.innerHTML = events.map(ev => {
    const venue = ev.venue || "Venue TBA";
    const location = ev.location || "";
    const main = ev.mainEvent;

    return `
      <div class="card">
        <div class="top">
          <div class="countdown">${daysUntil(ev.date)}</div>
          <h2 class="event-name">${ev.name}</h2>
          <div class="meta-row">
            <span class="item">${clockIcon} ${fmtDate(ev.date)} · ${fmtTime(ev.date)}</span>
            <span class="item">${pinIcon} ${venue}${location ? ', ' + location : ''}</span>
          </div>
        </div>
        ${main ? `
        <div class="main-event">
          <div class="label">Main event</div>
          <div class="bout">
            <span class="fighter left">${main.a}</span>
            <span class="vs">VS</span>
            <span class="fighter right">${main.b}</span>
          </div>
        </div>` : ''}
      </div>
    `;
  }).join('');
}

async function loadEvents(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="status">Loading upcoming events…</div>`;
  try{
    const res = await fetch(ENDPOINT);
    if (!res.ok) throw new Error("Network response was not OK");
    const data = await res.json();

    const events = (data.events || [])
      .filter(e => new Date(e.date) >= new Date(Date.now() - 1000*60*60*12)) // include events from last 12h onward
      .map(e => {
        const comp = e.competitions && e.competitions[0];
        let mainEvent = null;
        if (comp && comp.competitors && comp.competitors.length >= 2){
          mainEvent = {
            a: comp.competitors[0]?.athlete?.shortName || comp.competitors[0]?.athlete?.displayName || "TBA",
            b: comp.competitors[1]?.athlete?.shortName || comp.competitors[1]?.athlete?.displayName || "TBA"
          };
        }
        return {
          name: e.name || e.shortName,
          date: e.date,
          venue: comp?.venue?.fullName,
          location: [comp?.venue?.address?.city, comp?.venue?.address?.state || comp?.venue?.address?.country].filter(Boolean).join(', '),
          mainEvent
        };
      })
      .sort((a,b) => new Date(a.date) - new Date(b.date));

    render(events);
  } catch(err){
    app.innerHTML = `<div class="status error">Couldn't load events — check your connection and tap Refresh.</div>`;
    console.error(err);
  }
}

loadEvents();
// Auto-refresh every time the tab/app regains focus
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadEvents(); });
</script>

</body>
</html>
